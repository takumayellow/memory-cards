<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Memory Cards</title>
  <!-- Cache bust: update APP_VERSION and all ?v= params on each deploy -->
  <link rel="stylesheet" href="style.css?v=20260625c" />
  <link rel="stylesheet" href="srs.css?v=20260625c" />
  <style>
.deck-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  background: #f7f8fc;
  border-bottom: 1px solid #dde1f0;
  flex-wrap: wrap;
}
.deck-bar-label { font-size: 13px; color: #6b7280; font-weight: 600; }
.deck-bar select {
  border: 1px solid #dde1f0;
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 13px;
  background: #fff;
  color: #1e1b4b;
}
.deck-btn {
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid #c7d2fe;
  background: #eef2ff;
  color: #4f46e5;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.deck-btn:hover { background: #4f46e5; color: #fff; }
.deck-btn-danger { border-color: #fca5a5; background: #fff1f2; color: #dc2626; }
.deck-btn-danger:hover { background: #dc2626; color: #fff; }
.deck-btn-danger:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.deck-btn-link { border-color: #86efac; background: #f0fdf4; color: #16a34a; }
.deck-btn-link:hover { background: #16a34a; color: #fff; }
.deck-bar--highlight {
  background: #eef2ff;
  border-bottom-color: #c7d2fe;
  animation: deck-bar-pulse 1s ease-in-out 3;
}
@keyframes deck-bar-pulse {
  0%, 100% { background: #eef2ff; }
  50% { background: #dde4ff; }
}
  </style>
</head>
<body>
<header class="topbar">
  <h1>Memory Cards</h1>
  <div class="controls">
    <input id="q" type="search" placeholder="検索（名前・よみ・カテゴリ）" />
    <select id="cat">
      <option value="__ALL__">すべてのカテゴリ</option>
    </select>
    <button id="shuffle">シャッフル</button>
    <button id="reset" title="進捗をリセット">リセット</button>
    <button id="exportBadBtn" title="不適切とした画像IDリストをダウンロードし、再スクレイプに使用">📋 不適切リスト出力</button>
    <label class="srs-filter-label" title="今日復習すべきカードのみ表示">
      <input type="checkbox" id="srs-filter" />
      今日の復習
    </label>
  </div>
</header>

<div class="deck-bar">
  <span class="deck-bar-label">デッキ</span>
  <select id="deck-picker"></select>
  <button id="deck-import-btn" class="deck-btn">＋ インポート</button>
  <input id="deck-file-input" type="file" accept=".tsv,.csv,.json" style="display:none" />
  <button id="deck-delete-btn" class="deck-btn deck-btn-danger" disabled>🗑 削除</button>
  <a id="template-dl-tsv" class="deck-btn deck-btn-link" download="template.tsv">↓ テンプレ</a>
</div>

<!-- SRS 統計バー -->
<div class="srs-stats-bar">
  <div class="srs-stats-text" id="srs-stats">読み込み中...</div>
  <div class="srs-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="srs-progress-fill" id="srs-progress-bar" style="width:0%"></div>
  </div>
</div>

<main class="wrap">
  <div class="hud">
    <span>総数: <b id="count-total">0</b></span>
    <span>残り: <b id="count-rest">0</b></span>
  </div>

  <div class="nav-buttons">
    <button id="prev">← 前へ</button>
    <button id="next">次へ →</button>
  </div>

  <section id="card" class="card"></section>

  <div id="srs-badge" class="srs-badge srs-new"></div>

  <section class="buttons">
    <button id="okBtn" class="ok">わかった [→]</button>
    <button id="againBtn">あとで [←]</button>
    <button id="badImgBtn" class="bad-img">⚠ 画像が不適切</button>
  </section>
</main>

<script>window.APP_VERSION = '20260625c';</script>
<script src="dataset-manager.js?v=20260625c"></script>
<script src="srs.js?v=20260625c"></script>
<script src="app.js?v=20260625c"></script>
<script src="vocab-deck-init.js?v=20260625c"></script>
<script src="keyboard.js?v=20260625c"></script>
</body>
</html>
