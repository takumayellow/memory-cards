<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>芸能人 暗記カード</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="srs.css" />
</head>
<body>
<header class="topbar">
  <h1>芸能人 暗記カード <a href="anime.html" style="font-size:13px;color:#5ad;margin-left:12px;text-decoration:none">→ アニメギャラリー</a></h1>
  <div class="controls">
    <input id="q" type="search" placeholder="検索（名前・よみ・カテゴリ）" />
    <select id="cat">
      <option value="__ALL__">すべてのカテゴリ</option>
    </select>
    <button id="shuffle">シャッフル</button>
    <button id="reset" title="進捗をリセット">リセット</button>
    <button id="exportBadBtn" title="不適切とした画像IDリストをダウンロードし、再スクレイプに使用">📋 不適切リスト出力</button>
    <label class="srs-filter-label" title="今日復習すべきカードのみ表示">
      <input type="checkbox" id="srs-filter" />
      今日の復習
    </label>
  </div>
</header>

<!-- SRS 統計バー -->
<div class="srs-stats-bar">
  <div class="srs-stats-text" id="srs-stats">読み込み中...</div>
  <div class="srs-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="srs-progress-fill" id="srs-progress-bar" style="width:0%"></div>
  </div>
</div>

<main class="wrap">
  <div class="hud">
    <span>総数: <b id="count-total">0</b></span>
    <span>残り: <b id="count-rest">0</b></span>
  </div>

  <div class="nav-buttons">
    <button id="prev">← 前へ</button>
    <button id="next">次へ →</button>
  </div>

  <section id="card" class="card"></section>

  <div id="srs-badge" class="srs-badge srs-new"></div>

  <section class="buttons">
    <button id="okBtn" class="ok">わかった [→]</button>
    <button id="againBtn">あとで [←]</button>
    <button id="badImgBtn" class="bad-img">⚠ 画像が不適切</button>
  </section>
</main>

<script src="srs.js"></script>
<script src="app.js"></script>
</body>
</html>
